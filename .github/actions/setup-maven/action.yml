# Composite action: gói các bước "chuẩn bị Maven" mà workflow nào cũng cần.
#   1. Cài JDK (Temurin) + cache thư mục ~/.m2 giữa các lần chạy cho nhanh
#   2. Ghi ~/.m2/settings.xml để Maven đọc/ghi được GitHub Packages của org
#
# Workflow dùng action này PHẢI đặt biến môi trường GITHUB_TOKEN (thường là ${{ github.token }}).
# settings.xml chỉ ghi TÊN biến (${env.GITHUB_TOKEN}), không ghi giá trị token xuống đĩa.
#
# Vì sao repository khai báo ở đây mà không khai báo trong pom.xml?
#   - Trên máy dev, parent lấy từ ../platform và ~/.m2, không cần GitHub Packages (và không có token).
#     Nếu khai báo trong pom, Maven ở máy dev sẽ cố gọi GitHub Packages và báo lỗi 401.
#   - Chỉ máy CI mới cần, nên chỉ settings.xml của CI khai báo.
name: Setup Maven (Flower Shop)
description: Cài JDK và cấu hình Maven dùng GitHub Packages của org flower-shop-teddy

inputs:
  java-version:
    description: Phiên bản JDK
    default: '21'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven
        overwrite-settings: false   # settings.xml do bước dưới tự ghi

    - name: Ghi ~/.m2/settings.xml
      shell: bash
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<'EOF'
        <settings>
          <servers>
            <!-- id "github" khớp với <distributionManagement> và <repository> bên dưới -->
            <server>
              <id>github</id>
              <username>${env.GITHUB_ACTOR}</username>
              <password>${env.GITHUB_TOKEN}</password>
            </server>
          </servers>
          <profiles>
            <profile>
              <id>github-packages</id>
              <repositories>
                <!-- central đứng trước: thư viện bên ngoài lấy từ Maven Central,
                     chỉ com.flowershop mới cần tới GitHub Packages -->
                <repository>
                  <id>central</id>
                  <url>https://repo.maven.apache.org/maven2</url>
                  <snapshots><enabled>false</enabled></snapshots>
                </repository>
                <repository>
                  <id>github</id>
                  <url>https://maven.pkg.github.com/flower-shop-teddy/flower-shop-platform</url>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
              </repositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>github-packages</activeProfile>
          </activeProfiles>
        </settings>
        EOF
